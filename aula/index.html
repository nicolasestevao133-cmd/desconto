<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Calculadora de Desconto</h1>

        <form id="formulario">
            <label for="valor">Valor total da compra:</label>
            <input type="number" id="valor" min="0" step="0.01" required>

            <button type="submit">Calcular</button>
        </form>

        <p>Valor da compra: <span id="total">R$ 0,00</span></p>
        <p>Valor do desconto: <span id="desconto">R$ 0,00</span></p>
        <p>Total com desconto: <span id="final">R$ 0,00</span></p>
    </main>

    <script src="main.js"></script>
</body>
</html>
